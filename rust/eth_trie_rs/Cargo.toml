[package]
name = "eth_trie_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "eth_trie_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
alloy-trie = "=0.7.4"
alloy-primitives = "=0.8.5"
alloy-rlp = { version = "=0.3.8", features = ["derive"] }
